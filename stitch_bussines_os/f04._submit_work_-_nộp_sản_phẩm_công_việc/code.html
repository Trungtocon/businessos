<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Submit Work Modal - BusinessOS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0667f9",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1723",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white overflow-hidden">
<!-- Mock Background Content (To simulate overlay context) -->
<div aria-hidden="true" class="fixed inset-0 z-0 opacity-20 pointer-events-none filter blur-[2px]">
<div class="flex h-screen w-full flex-col">
<header class="h-16 w-full border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900"></header>
<div class="flex flex-1">
<aside class="w-64 border-r border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hidden md:block"></aside>
<main class="flex-1 bg-background-light dark:bg-background-dark p-8">
<div class="h-32 w-full bg-slate-200 dark:bg-slate-800 rounded mb-4"></div>
<div class="h-64 w-full bg-slate-200 dark:bg-slate-800 rounded"></div>
</main>
</div>
</div>
</div>
<!-- Modal Overlay -->
<div class="relative z-50 flex min-h-screen w-full items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
<!-- Modal Container -->
<div class="layout-content-container flex flex-col w-full max-w-[640px] bg-white dark:bg-[#1e293b] rounded-xl shadow-2xl overflow-hidden border border-slate-200 dark:border-slate-700 animate-fade-in-up">
<!-- Modal Header -->
<div class="flex items-center justify-between px-6 py-5 border-b border-slate-100 dark:border-slate-700">
<h3 class="text-slate-900 dark:text-white tracking-tight text-xl font-bold leading-tight">
                    Nộp sản phẩm công việc
                </h3>
<button class="flex items-center justify-center w-8 h-8 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<!-- Modal Body -->
<div class="flex flex-col p-6 gap-6 overflow-y-auto max-h-[80vh]">
<!-- File Upload Zone -->
<div class="flex flex-col">
<label class="text-slate-900 dark:text-white text-sm font-semibold mb-2">Tệp đính kèm</label>
<div class="group flex flex-col items-center justify-center gap-4 rounded-xl border-2 border-dashed border-slate-300 dark:border-slate-600 hover:border-primary hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-all px-6 py-10 cursor-pointer relative">
<!-- Cloud Icon -->
<div class="w-16 h-16 rounded-full bg-blue-50 dark:bg-slate-800 flex items-center justify-center group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-primary text-4xl">cloud_upload</span>
</div>
<div class="flex flex-col items-center gap-1 text-center">
<p class="text-slate-900 dark:text-white text-base font-bold leading-tight">
                                Kéo thả file kết quả vào đây
                            </p>
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal">
                                Hỗ trợ định dạng: JPG, PDF, ZIP. Tối đa 50MB.
                            </p>
</div>
<button class="mt-2 flex items-center justify-center overflow-hidden rounded-lg h-9 px-4 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 text-sm font-semibold transition-colors">
<span class="truncate">Hoặc chọn file từ máy tính</span>
</button>
<input class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" type="file"/>
</div>
</div>
<!-- Divider -->
<div class="flex items-center gap-4">
<div class="h-px bg-slate-200 dark:bg-slate-700 flex-1"></div>
<span class="text-slate-400 dark:text-slate-500 text-xs font-medium uppercase tracking-wider">Hoặc</span>
<div class="h-px bg-slate-200 dark:bg-slate-700 flex-1"></div>
</div>
<!-- External Link Input -->
<div class="flex flex-col gap-2">
<label class="flex flex-col w-full">
<p class="text-slate-900 dark:text-white text-sm font-semibold leading-normal pb-2">Liên kết ngoài (Google Drive, Figma...)</p>
<div class="relative">
<div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
<span class="material-symbols-outlined text-slate-400 text-[20px]">link</span>
</div>
<input class="form-input flex w-full min-w-0 resize-none rounded-lg text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-0 focus:ring-2 focus:ring-primary/50 focus:border-primary border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-800 h-12 pl-10 pr-4 text-base font-normal leading-normal transition-shadow" placeholder="https://..." type="url" value=""/>
</div>
</label>
</div>
<!-- Deadline Notice -->
<div class="bg-blue-50 dark:bg-blue-900/20 border border-blue-100 dark:border-blue-900/50 rounded-lg p-4 flex items-start gap-3">
<span class="material-symbols-outlined text-primary text-[20px] mt-0.5">schedule</span>
<div class="flex flex-col gap-1">
<p class="text-slate-900 dark:text-white text-sm font-medium">Hạn chót: 17:00 hôm nay</p>
<p class="text-slate-600 dark:text-slate-300 text-sm font-normal">
                            Lưu ý: Bạn còn <span class="text-primary font-semibold">2 giờ</span> để nộp bài trước deadline.
                        </p>
</div>
</div>
</div>
<!-- Modal Footer -->
<div class="px-6 py-4 bg-slate-50 dark:bg-slate-800/50 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-11 px-5 bg-white dark:bg-transparent border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 text-sm font-semibold transition-colors">
                    Hủy bỏ
                </button>
<button class="flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-11 px-6 bg-primary hover:bg-blue-600 text-white text-sm font-bold tracking-[0.015em] shadow-sm hover:shadow transition-all">
                    Xác nhận nộp bài
                </button>
</div>
</div>
</div>
</body></html>
