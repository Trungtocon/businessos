<!-- Simple Script for Input Focus Handling (Enhancement for UX) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input[type="text"]');
            
            inputs.forEach((input, index) => {
                input.addEventListener('input', (e) => {
                    const value = e.target.value;
                    
                    // Allow only numbers
                    if (!/^\d*$/.test(value)) {
                        e.target.value = value.replace(/[^\d]/g, '');
                        return;
                    }

                    // Move to next input if value is entered
                    if (value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });

                input.addEventListener('keydown', (e) => {
                    // Move to previous input on Backspace if empty
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
                
                // Handle Paste
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const text = (e.clipboardData || window.clipboardData).getData('text');
                    if (!/^\d+$/.test(text)) return; // Only numbers
                    
                    const digits = text.split('').slice(0, inputs.length);
                    digits.forEach((digit, i) => {
                        if (index + i < inputs.length) {
                            inputs[index + i].value = digit;
                            // Focus the last filled input or the next one if available
                            if (i === digits.length - 1 && index + i < inputs.length) {
                                inputs[Math.min(index + i + 1, inputs.length - 1)].focus();
                            } else {
                                inputs[Math.min(index + i, inputs.length - 1)].focus();
                            }
                        }
                    });
                });
            });
        });
    </script>
