<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Feedback Popup - BusinessOS</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0657f9",
                        "primary-hover": "#054ad4",
                        "background-light": "#f5f6f8",
                        "background-dark": "#0f1623",
                        "card-light": "#ffffff",
                        "card-dark": "#1a2230",
                        "text-main": "#0d121c",
                        "text-secondary": "#6b7280",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .star-filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: #fbbf24; /* Amber-400 */
        }
        .star-empty {
            color: #d1d5db; /* Gray-300 */
        }
        /* Custom scrollbar for textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent; 
        }
        textarea::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        textarea::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="font-display bg-background-light dark:bg-background-dark overflow-hidden relative min-h-screen flex flex-col">
<!-- Blurred Background (Simulated Dashboard Context) -->
<div aria-hidden="true" class="absolute inset-0 z-0 flex flex-col opacity-100 transition-opacity duration-300 pointer-events-none filter blur-[6px] select-none">
<!-- Dashboard Header -->
<div class="h-16 w-full bg-white dark:bg-card-dark border-b border-gray-200 dark:border-gray-800 flex items-center px-6 justify-between">
<div class="flex items-center gap-4">
<div class="h-8 w-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold">B</div>
<div class="h-4 w-32 bg-gray-200 dark:bg-gray-700 rounded"></div>
</div>
<div class="flex gap-4">
<div class="h-8 w-8 rounded-full bg-gray-200 dark:bg-gray-700"></div>
<div class="h-8 w-8 rounded-full bg-gray-200 dark:bg-gray-700"></div>
</div>
</div>
<div class="flex flex-1 overflow-hidden">
<!-- Sidebar -->
<div class="w-64 bg-white dark:bg-card-dark border-r border-gray-200 dark:border-gray-800 hidden md:flex flex-col p-4 gap-4">
<div class="h-10 w-full bg-primary/10 rounded-lg"></div>
<div class="h-6 w-3/4 bg-gray-100 dark:bg-gray-800 rounded"></div>
<div class="h-6 w-full bg-gray-100 dark:bg-gray-800 rounded"></div>
<div class="h-6 w-5/6 bg-gray-100 dark:bg-gray-800 rounded"></div>
</div>
<!-- Main Content Placeholder -->
<div class="flex-1 p-8 bg-background-light dark:bg-background-dark">
<div class="w-full h-full border border-gray-200 dark:border-gray-800 rounded-xl bg-white dark:bg-card-dark p-6">
<div class="flex justify-between mb-8">
<div class="h-8 w-48 bg-gray-200 dark:bg-gray-700 rounded"></div>
<div class="h-8 w-24 bg-green-100 text-green-700 dark:bg-green-900 dark:text-green-300 rounded px-3 py-1 text-sm font-medium flex items-center justify-center">Hoàn thành</div>
</div>
<div class="space-y-4">
<div class="h-4 w-full bg-gray-100 dark:bg-gray-800 rounded"></div>
<div class="h-4 w-full bg-gray-100 dark:bg-gray-800 rounded"></div>
<div class="h-4 w-2/3 bg-gray-100 dark:bg-gray-800 rounded"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Overlay Backdrop -->
<div class="fixed inset-0 z-40 bg-gray-900/50 backdrop-blur-sm transition-all duration-300"></div>
<!-- Modal Container -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto">
<div class="relative w-full max-w-[520px] transform rounded-2xl bg-white dark:bg-card-dark shadow-2xl transition-all border border-gray-100 dark:border-gray-700 flex flex-col">
<!-- Close Button -->
<button class="absolute right-4 top-4 rounded-full p-2 text-gray-400 hover:bg-gray-100 hover:text-gray-500 dark:hover:bg-gray-800 dark:text-gray-500 dark:hover:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<span class="sr-only">Close</span>
<span class="material-symbols-outlined text-xl">close</span>
</button>
<!-- Modal Content -->
<div class="flex flex-col items-center px-6 pt-10 pb-8 text-center sm:px-10">
<!-- Success Icon -->
<div class="mx-auto flex h-20 w-20 shrink-0 items-center justify-center rounded-full bg-green-50 dark:bg-green-900/20 mb-6 ring-8 ring-green-50/50 dark:ring-green-900/10">
<span class="material-symbols-outlined text-5xl text-green-600 dark:text-green-400" style="font-variation-settings: 'FILL' 1, 'wght' 600;">check_circle</span>
</div>
<!-- Headline -->
<h2 class="text-2xl font-bold leading-tight tracking-tight text-text-main dark:text-white mb-2">
                    Dự án hoàn thành!
                </h2>
<!-- Body Text -->
<p class="text-base text-text-secondary dark:text-gray-400 max-w-sm mx-auto mb-8">
                    Bạn cảm thấy thế nào về chất lượng công việc của Freelancer trong dự án này?
                </p>
<!-- Star Rating Section -->
<div class="w-full mb-8">
<div aria-label="Rating" class="flex justify-center gap-3" role="group">
<button class="group transition-transform hover:scale-110 focus:outline-none focus:scale-110">
<span class="material-symbols-outlined text-5xl star-filled drop-shadow-sm">star</span>
</button>
<button class="group transition-transform hover:scale-110 focus:outline-none focus:scale-110">
<span class="material-symbols-outlined text-5xl star-filled drop-shadow-sm">star</span>
</button>
<button class="group transition-transform hover:scale-110 focus:outline-none focus:scale-110">
<span class="material-symbols-outlined text-5xl star-filled drop-shadow-sm">star</span>
</button>
<button class="group transition-transform hover:scale-110 focus:outline-none focus:scale-110">
<span class="material-symbols-outlined text-5xl star-filled drop-shadow-sm">star</span>
</button>
<button class="group transition-transform hover:scale-110 focus:outline-none focus:scale-110">
<span class="material-symbols-outlined text-5xl star-empty hover:text-yellow-400 transition-colors">star</span>
</button>
</div>
<p class="mt-2 text-sm font-medium text-primary dark:text-blue-400">Rất tốt!</p>
</div>
<!-- Text Field -->
<div class="w-full mb-8 text-left">
<label class="block text-sm font-semibold text-text-main dark:text-gray-200 mb-2" for="feedback">
                        Nhận xét chi tiết
                    </label>
<div class="relative">
<textarea class="block w-full rounded-xl border-gray-200 dark:border-gray-600 bg-background-light dark:bg-background-dark py-3 px-4 text-text-main dark:text-white shadow-sm placeholder:text-gray-400 focus:border-primary focus:ring-primary sm:text-sm resize-none transition-all" id="feedback" name="feedback" placeholder="Hãy chia sẻ thêm về trải nghiệm của bạn (tiến độ, kỹ năng, thái độ)..." rows="4"></textarea>
</div>
</div>
<!-- Action Buttons -->
<div class="flex w-full flex-col-reverse gap-3 sm:flex-row sm:justify-end">
<button class="inline-flex w-full items-center justify-center rounded-lg bg-white dark:bg-transparent px-4 py-2.5 text-sm font-semibold text-gray-700 dark:text-gray-300 shadow-sm ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-gray-800 sm:w-auto sm:min-w-[100px] transition-colors" type="button">
                        Bỏ qua
                    </button>
<button class="inline-flex w-full items-center justify-center rounded-lg bg-primary px-4 py-2.5 text-sm font-bold text-white shadow-sm hover:bg-primary-hover focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary sm:w-auto sm:min-w-[140px] transition-colors" type="button">
                        Gửi đánh giá
                    </button>
</div>
</div>
</div>
</div>
</body></html>
