<!DOCTYPE html>

<html class="light" lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>S05. Onboarding Wizard - Thiết lập ban đầu</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0663f9",
                        "primary-hover": "#044bbd",
                        "background-light": "#f5f7f8",
                        "background-dark": "#0f1723",
                        "card-light": "#ffffff",
                        "card-dark": "#1e293b",
                        "text-main": "#0d131c",
                        "text-secondary": "#47699e",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
                        'selected': '0 0 0 2px #0663f9',
                    }
                },
            },
        }
    </script>
<!-- Google Fonts & Icons -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .selected .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
            color: #0663f9;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-text-main dark:text-white transition-colors duration-200">
<div class="relative flex min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<!-- Header / Progress Bar Section -->
<div class="layout-container flex flex-col">
<div class="flex justify-center pt-8 pb-4 px-4 sm:px-10">
<div class="flex flex-col w-full max-w-[960px]">
<!-- Progress Bar -->
<div class="flex flex-col gap-3 mb-8">
<div class="flex gap-6 justify-between items-center">
<p class="text-text-main dark:text-gray-200 text-sm font-medium leading-normal">Bước 1/3: Thiết lập chung</p>
<span class="text-text-secondary dark:text-gray-400 text-xs">33%</span>
</div>
<div class="rounded-full bg-[#ced8e9] dark:bg-gray-700 h-2 w-full overflow-hidden">
<div class="h-full rounded-full bg-primary transition-all duration-500 ease-out" style="width: 33%;"></div>
</div>
</div>
<!-- Page Heading -->
<div class="flex flex-col gap-3 pb-6">
<h1 class="text-text-main dark:text-white text-3xl sm:text-4xl font-black leading-tight tracking-[-0.033em]">Thiết lập ban đầu</h1>
<p class="text-text-secondary dark:text-gray-400 text-base font-normal leading-normal max-w-2xl">
                            Hãy cho chúng tôi biết thêm về doanh nghiệp của bạn để tối ưu hóa trải nghiệm trên BusinessOS.
                        </p>
</div>
</div>
</div>
</div>
<!-- Main Content Form -->
<div class="flex flex-1 justify-center px-4 sm:px-10 pb-20">
<div class="flex flex-col max-w-[960px] flex-1 gap-8">
<!-- Section: Industry -->
<div class="flex flex-col gap-4">
<h3 class="text-text-main dark:text-gray-100 text-xl font-bold leading-tight">Ngành nghề kinh doanh</h3>
<!-- Grid of Industry Cards -->
<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
<!-- Card 1 -->
<button class="group flex flex-col items-center gap-3 p-4 bg-card-light dark:bg-card-dark rounded-lg border border-transparent hover:border-gray-200 dark:hover:border-gray-600 hover:shadow-soft transition-all text-center">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-blue-50 dark:bg-slate-700 text-text-secondary dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl">storefront</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-gray-200">Bán lẻ</span>
</button>
<!-- Card 2 (Selected) -->
<button class="selected group relative flex flex-col items-center gap-3 p-4 bg-white dark:bg-card-dark rounded-lg shadow-selected ring-offset-2 dark:ring-offset-background-dark transition-all text-center">
<div class="absolute top-2 right-2 text-primary">
<span class="material-symbols-outlined text-xl">check_circle</span>
</div>
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-primary/10 text-primary">
<span class="material-symbols-outlined text-3xl">computer</span>
</div>
<span class="text-sm font-semibold text-primary">Công nghệ</span>
</button>
<!-- Card 3 -->
<button class="group flex flex-col items-center gap-3 p-4 bg-card-light dark:bg-card-dark rounded-lg border border-transparent hover:border-gray-200 dark:hover:border-gray-600 hover:shadow-soft transition-all text-center">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-blue-50 dark:bg-slate-700 text-text-secondary dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl">factory</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-gray-200">Sản xuất</span>
</button>
<!-- Card 4 -->
<button class="group flex flex-col items-center gap-3 p-4 bg-card-light dark:bg-card-dark rounded-lg border border-transparent hover:border-gray-200 dark:hover:border-gray-600 hover:shadow-soft transition-all text-center">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-blue-50 dark:bg-slate-700 text-text-secondary dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl">support_agent</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-gray-200">Dịch vụ</span>
</button>
<!-- Card 5 -->
<button class="group flex flex-col items-center gap-3 p-4 bg-card-light dark:bg-card-dark rounded-lg border border-transparent hover:border-gray-200 dark:hover:border-gray-600 hover:shadow-soft transition-all text-center">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-blue-50 dark:bg-slate-700 text-text-secondary dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl">school</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-gray-200">Giáo dục</span>
</button>
<!-- Card 6 -->
<button class="group flex flex-col items-center gap-3 p-4 bg-card-light dark:bg-card-dark rounded-lg border border-transparent hover:border-gray-200 dark:hover:border-gray-600 hover:shadow-soft transition-all text-center">
<div class="w-12 h-12 flex items-center justify-center rounded-full bg-blue-50 dark:bg-slate-700 text-text-secondary dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined text-3xl">more_horiz</span>
</div>
<span class="text-sm font-medium text-text-main dark:text-gray-200">Khác</span>
</button>
</div>
</div>
<!-- Section: Company Size -->
<div class="flex flex-col gap-4">
<h3 class="text-text-main dark:text-gray-100 text-xl font-bold leading-tight">Quy mô công ty</h3>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
<!-- Option 1 -->
<button class="group flex items-center gap-4 p-4 bg-card-light dark:bg-card-dark rounded-lg border border-transparent hover:border-gray-200 dark:hover:border-gray-600 hover:shadow-soft transition-all text-left">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg bg-blue-50 dark:bg-slate-700 text-text-secondary dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
</div>
<div class="flex flex-col">
<span class="text-base font-medium text-text-main dark:text-gray-200">1 - 10</span>
<span class="text-xs text-text-secondary dark:text-gray-400">Nhân sự</span>
</div>
</button>
<!-- Option 2 (Selected) -->
<button class="selected group relative flex items-center gap-4 p-4 bg-white dark:bg-card-dark rounded-lg shadow-selected ring-offset-2 dark:ring-offset-background-dark transition-all text-left">
<div class="absolute top-2 right-2 text-primary opacity-100">
<span class="material-symbols-outlined text-lg">check_circle</span>
</div>
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg bg-primary/10 text-primary">
<span class="material-symbols-outlined">groups</span>
</div>
<div class="flex flex-col">
<span class="text-base font-semibold text-primary">11 - 50</span>
<span class="text-xs text-primary/80">Nhân sự</span>
</div>
</button>
<!-- Option 3 -->
<button class="group flex items-center gap-4 p-4 bg-card-light dark:bg-card-dark rounded-lg border border-transparent hover:border-gray-200 dark:hover:border-gray-600 hover:shadow-soft transition-all text-left">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg bg-blue-50 dark:bg-slate-700 text-text-secondary dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">domain</span>
</div>
<div class="flex flex-col">
<span class="text-base font-medium text-text-main dark:text-gray-200">51 - 200</span>
<span class="text-xs text-text-secondary dark:text-gray-400">Nhân sự</span>
</div>
</button>
<!-- Option 4 -->
<button class="group flex items-center gap-4 p-4 bg-card-light dark:bg-card-dark rounded-lg border border-transparent hover:border-gray-200 dark:hover:border-gray-600 hover:shadow-soft transition-all text-left">
<div class="w-10 h-10 flex-shrink-0 flex items-center justify-center rounded-lg bg-blue-50 dark:bg-slate-700 text-text-secondary dark:text-gray-300 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined">apartment</span>
</div>
<div class="flex flex-col">
<span class="text-base font-medium text-text-main dark:text-gray-200">200+</span>
<span class="text-xs text-text-secondary dark:text-gray-400">Nhân sự</span>
</div>
</button>
</div>
</div>
</div>
</div>
<!-- Sticky Footer -->
<div class="fixed bottom-0 left-0 w-full bg-white/80 dark:bg-background-dark/90 backdrop-blur-md border-t border-gray-200 dark:border-gray-800 py-4 px-4 sm:px-10 z-10">
<div class="flex justify-between items-center max-w-[960px] mx-auto w-full">
<!-- Back Button -->
<button class="px-6 py-2.5 rounded-lg text-sm font-medium text-text-secondary dark:text-gray-400 hover:text-text-main dark:hover:text-white hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
                    Quay lại
                </button>
<!-- Continue Button -->
<button class="px-8 py-2.5 rounded-lg bg-primary hover:bg-primary-hover text-white text-sm font-bold shadow-lg shadow-blue-500/30 transition-all flex items-center gap-2">
                    Tiếp tục
                    <span class="material-symbols-outlined text-sm font-bold">arrow_forward</span>
</button>
</div>
</div>
</div>
</body></html>
